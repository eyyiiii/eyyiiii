<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keyla</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 10% 20%, #c8d8f2 0%, transparent 45%),
      radial-gradient(ellipse at 90% 80%, #f2c8dc 0%, transparent 45%),
      radial-gradient(ellipse at 60% 40%, #dcd0f0 0%, transparent 40%),
      #e8e4f4;
    font-family: 'Cormorant Garamond', serif;
  }

  /* petals */
  .petal {
    position: fixed;
    pointer-events: none;
    font-size: var(--s, 12px);
    opacity: 0;
    animation: floatDown var(--d, 10s) var(--delay, 0s) ease-in-out infinite;
    z-index: 0;
  }
  @keyframes floatDown {
    0%   { transform: translateY(-40px) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(105vh) translateX(var(--drift, 30px)) rotate(180deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 253, 255, 0.52);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 36px;
    padding: 68px 60px;
    max-width: 430px;
    width: 86vw;
    text-align: center;
    box-shadow:
      0 20px 70px rgba(140, 160, 210, 0.14),
      0 4px 16px rgba(200, 140, 180, 0.08),
      inset 0 1px 0 rgba(255,255,255,0.95);
    animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(36px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .eyebrow {
    font-size: 0.62rem;
    letter-spacing: 7px;
    color: #b0bedd;
    margin-bottom: 40px;
    opacity: 0;
    animation: soft 1s 0.4s forwards;
  }

  .greeting {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 300;
    font-style: italic;
    color: #9aaccc;
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0;
    animation: soft 1s 0.55s forwards;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 14vw, 6rem);
    font-style: italic;
    background: linear-gradient(160deg, #90aad8 10%, #c896be 60%, #e8a8c4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    letter-spacing: -1px;
    margin-bottom: 36px;
    opacity: 0;
    animation: soft 1.2s 0.7s forwards;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 auto 30px;
    width: fit-content;
    opacity: 0;
    animation: soft 1s 0.9s forwards;
  }
  .rule-line {
    width: 32px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c0cce8);
  }
  .rule-line.r { background: linear-gradient(90deg, #e8b8cc, transparent); }
  .rule-dot { width: 4px; height: 4px; border-radius: 50%; background: #d0b8e0; }

  .age {
    font-size: 0.63rem;
    letter-spacing: 5px;
    color: #c0b0d4;
    margin-bottom: 28px;
    opacity: 0;
    animation: soft 1s 1s forwards;
  }

  .msg {
    font-size: 1.08rem;
    font-weight: 300;
    font-style: italic;
    color: #8a96bc;
    line-height: 2.1;
    opacity: 0;
    animation: soft 1s 1.1s forwards;
  }
  .msg .accent { color: #c4a0c8; }

  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    animation: soft 1s 1.3s forwards;
  }
  .pearl {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: shimmer 3s ease-in-out infinite;
  }
  .pearl:nth-child(1) { background: #b8ccee; animation-delay: 0s; }
  .pearl:nth-child(2) { background: #cdb8e4; animation-delay: 0.5s; }
  .pearl:nth-child(3) { background: #e8b8d0; animation-delay: 1s; }

  @keyframes shimmer {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50%       { transform: scale(1.5); opacity: 1; }
  }
  @keyframes soft {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<script>
  const petals = ['✿','❀','·','˙','∘'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random() * petals.length)];
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      --s: ${10 + Math.random() * 10}px;
      --d: ${8 + Math.random() * 10}s;
      --delay: ${Math.random() * 10}s;
      --drift: ${(Math.random() - 0.5) * 80}px;
      color: ${['#b8ccee','#e8b8d0','#cdb8e4'][Math.floor(Math.random()*3)]};
    `;
    document.body.prepend(p);
  }
</script>

<div class="card">
  <div class="eyebrow">✦ &nbsp; for you &nbsp; ✦</div>

  <div class="greeting">happy birthday,</div>
  <div class="name">keyla</div>

  <div class="rule">
    <div class="rule-line"></div>
    <div class="rule-dot"></div>
    <div class="rule-line r"></div>
  </div>

  <div class="age">18 tahun &nbsp;·&nbsp; 2008 — 2026</div>

  <p class="msg">
    akhirnya 18 <span class="accent">♡</span><br>
    semoga tahun ini jadi yang paling seru,<br>
    makin bahagia, makin berkembang,<br>
    dan semua yang kamu mau<br>
    pelan-pelan dateng ya,
  </p>

  <div class="footer">
    <div class="pearl"></div>
    <div class="pearl"></div>
    <div class="pearl"></div>
  </div>
</div>

</body>
</html>
